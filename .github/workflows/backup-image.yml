name: Backup image

# Publishes deploy/backup as ghcr.io/regatlas-llc/visicomms-backup. The
# accessory in config/deploy.yml pins the major tag (:1); bump it, and that
# tag here, for an incompatible change.
on:
  push:
    branches: [main]
    paths: [deploy/backup/**, .github/workflows/backup-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only the hosted deployment's repository publishes this image.
    if: github.repository == 'RegAtlas-LLC/visicomms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/regatlas-llc/visicomms-backup:1
            ghcr.io/regatlas-llc/visicomms-backup:${{ github.sha }}
